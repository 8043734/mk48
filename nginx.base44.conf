# Base44 dev proxy.
#
# The kodiak game server validates the websocket's Origin header against
# localhost / ports 8080 and 8443 / its own domains (see kodiak 0.2.0
# router::check_origin_quiet). The public preview origin is none of those,
# so this proxy rewrites Origin to the whitelisted http://localhost:8080.
# It also tunnels websocket upgrades and streams the (large) debug WASM build.

server {
    listen 80;

    client_max_body_size 64m;

    location / {
        proxy_pass http://game:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin "http://localhost:8080";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
